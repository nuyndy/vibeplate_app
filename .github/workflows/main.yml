name: Dev Quality Check
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install # Hoặc lệnh tương ứng của ngôn ngữ bạn dùng
      - name: Run Tests
        run: npm test    # Hệ thống sẽ tự chạy các bản test bạn đã viết
